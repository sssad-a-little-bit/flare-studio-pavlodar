  <path d="m471 493 16-12 26 11 7 13-22 10-24-11-3-11Z" fill="#314859" stroke="#9db0bb" stroke-width="2"/>
  <path d="m95 517 12-8 11 25-12 7-11-24Z" fill="#8e4c48"/>
</svg>

