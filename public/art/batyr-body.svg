  <path d="m500 510 220 90 160-80" stroke="#e9eee8" stroke-opacity=".8" stroke-width="2"/>
  <path d="m720 600 160-80 18 154-166 115-12-189Z" fill="url(#frontMetal)"/>
  <path d="m726 619 53-26 5 27-54 27-4-28Zm111-55 42-21 3 27-42 22-3-28Z" fill="#0a141f" stroke="#91a9bb" stroke-width="1.5"/>
  <path d="m736 627 37-19m71-35 30-15" stroke="#8facff" stroke-width="9" filter="url(#lampGlow)" opacity=".6"/>
  <path d="m736 627 37-19m71-35 30-15" stroke="#dbeaff" stroke-width="5"/>
  <path d="m785 628 46-23 10 49-48 28-8-54Z" fill="#0a1520" stroke="#607988" stroke-width="2"/>
  <path d="m795 631 5 34m7-40 5 34m7-40 5 34" stroke="#2a4153" stroke-width="5"/>
  <path d="m743 706 136-72 4 29-138 82-2-39Z" fill="#0a1420"/>
  <path d="m748 711 125-66" stroke="#4c6577" stroke-width="2"/>
  <path d="m732 760 162-101 4 15-166 115-4-28Z" fill="#101c2a"/>
  <path d="m733 759 156-95" stroke="#8498a5" stroke-opacity=".4" stroke-width="2"/>

  <!-- Continuous side panels, wheel arches, and sill. -->
  <path d="m102 503 406 64 53 27" stroke="#e0e6e0" stroke-width="2" opacity=".65"/>
  <path d="m193 477 314 69" stroke="#315bff" stroke-opacity=".55" stroke-width="3"/>
