[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-leads"
version = "0.1.0"
description = "Локальная база лидов Flare Studio"
requires-python = ">=3.11"
dependencies = ["requests==2.32.5", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
flare = "flare.cli:main"

[tool.setuptools.packages.find]
include = ["flare*"]

[tool.setuptools.package-data]
flare = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
